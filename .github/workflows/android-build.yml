# v1.0.4 - Build after secret update
name: Android Build & Release
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_EXIST: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Validate Service Worker Route + Cache Key Stability
        run: npm run sw:validate

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build Android Artifacts
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          
          # Force use the keystore committed to the repo
          KEYSTORE_PATH="$GITHUB_WORKSPACE/quran-app-key.jks"
          
          echo "Building Debug APK..."
          ./gradlew clean assembleDebug
          
          if [ -f "$KEYSTORE_PATH" ]; then
            echo "Using keystore at $KEYSTORE_PATH"
            echo "Building Signed Release App Bundle (.aab)..."
            ./gradlew bundleRelease \
              -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
              -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
            
            echo "Building Signed Release APK (.apk)..."
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
              -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          else
            echo "CRITICAL ERROR: quran-app-key.jks not found in repo!"
            exit 1
          fi

      - name: Get SHA Fingerprints
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "--- DEBUG FINGERPRINTS ---"
          cd android && ./gradlew signingReport
          
          if [ -f "app/release-key.keystore" ]; then
            echo "--- RELEASE FINGERPRINTS (PRO) ---"
            keytool -list -v -keystore app/release-key.keystore -alias "$KEY_ALIAS" -storepass "$STORE_PASSWORD" | grep -E "SHA1|SHA256"
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: quraaniat-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Upload Release APK
        if: env.KEYSTORE_EXIST != ''
        uses: actions/upload-artifact@v4
        with:
          name: quraaniat-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload Release Bundle (.aab)
        if: env.KEYSTORE_EXIST != ''
        uses: actions/upload-artifact@v4
        with:
          name: quraaniat-release-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
