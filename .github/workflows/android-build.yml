name: Android Build & Release
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Decode Keystore
        id: decode_keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release-key.keystore

      - name: Build Android Artifacts
        run: |
          cd android
          chmod +x gradlew
          
          echo "Building Debug APK..."
          ./gradlew assembleDebug
          
          if [ -f "app/release-key.keystore" ]; then
            echo "Building Signed Release App Bundle (.aab)..."
            ./gradlew bundleRelease \
              -Pandroid.injected.signing.store.file=release-key.keystore \
              -Pandroid.injected.signing.store.password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
              -Pandroid.injected.signing.key.alias=${{ secrets.ANDROID_KEY_ALIAS }} \
              -Pandroid.injected.signing.key.password=${{ secrets.ANDROID_KEY_PASSWORD }}
          else
            echo "No keystore found, skipping Signed Release Bundle."
          fi

      - name: Get SHA Fingerprints
        run: |
          cd android
          ./gradlew signingReport

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: quraaniat-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Upload Release Bundle (.aab)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: quraaniat-release-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
