name: Android Build & Release
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_EXIST: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Validate Service Worker Route + Cache Key Stability
        run: npm run sw:validate

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Decode Keystore
        id: decode_keystore
        if: env.KEYSTORE_EXIST != ''
        env:
          BASE64_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # Use printf to avoid trailing newline/interpretation issues
          printf "%s" "$BASE64_KEY" | tr -d '\n\r ' | base64 --decode > android/app/release-key.keystore
          
          # Troubleshooting info (visible in logs)
          echo "Checking file size..."
          ls -l android/app/release-key.keystore
          echo "Checking file type..."
          file android/app/release-key.keystore

      - name: Verify Keystore Integrity
        if: env.KEYSTORE_EXIST != ''
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "Testing keystore access..."
          keytool -list -keystore android/app/release-key.keystore -storepass "$STORE_PASSWORD"

      - name: Build Android Artifacts
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          
          echo "--- DEBUG: Checking for problematic assets ---"
          find . -name "ic_launcher_background.png" -exec ls -l {} +
          echo "--- DEBUG: Deleting potential problematic assets ---"

          
          # Delete legacy density folders that often cause compilation issues with modern assets
          echo "--- CLEANING LEGACY MISMITS ---"
          rm -rf app/src/main/res/mipmap-ldpi
          rm -rf app/src/main/res/mipmap-mdpi
          
          # Fix for AAPT: error: file failed to compile (PNG errors)
          echo "--- FIXING PNG ASSETS (CRITICAL) ---"
          # Strip all profiles and metadata that AAPT2 dislikes
          find app/src/main/res -name "*.png" -exec mogrify -strip {} + || true
          
          echo "Building Debug APK..."
          ./gradlew clean assembleDebug
          
          # Logic to determine which keystore to use
          if [ -f "app/release-key.keystore" ]; then
            KEYSTORE_PATH="$GITHUB_WORKSPACE/android/app/release-key.keystore"
          elif [ -f "../quran-app-key.jks" ]; then
            KEYSTORE_PATH="$GITHUB_WORKSPACE/quran-app-key.jks"
          fi

          if [ -n "$KEYSTORE_PATH" ]; then
            echo "Using keystore at $KEYSTORE_PATH"
            echo "Building Signed Release App Bundle (.aab)..."
            ./gradlew bundleRelease \
              -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
              -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
            
            echo "Building Signed Release APK (.apk)..."
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
              -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          else
            echo "No keystore found, skipping Signed Release artifacts."
          fi

      - name: Get SHA Fingerprints
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "--- DEBUG FINGERPRINTS ---"
          cd android && ./gradlew signingReport
          
          if [ -f "app/release-key.keystore" ]; then
            echo "--- RELEASE FINGERPRINTS (PRO) ---"
            keytool -list -v -keystore app/release-key.keystore -alias "$KEY_ALIAS" -storepass "$STORE_PASSWORD" | grep -E "SHA1|SHA256"
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: quraaniat-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Upload Release APK
        if: env.KEYSTORE_EXIST != ''
        uses: actions/upload-artifact@v4
        with:
          name: quraaniat-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload Release Bundle (.aab)
        if: env.KEYSTORE_EXIST != ''
        uses: actions/upload-artifact@v4
        with:
          name: quraaniat-release-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
