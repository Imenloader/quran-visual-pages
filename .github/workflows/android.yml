name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Auto-increment Version
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Create ADI registration file
        run: |
          mkdir -p android/app/src/main/assets
          echo "CANUIZDSUMW6QAAAAAAAAAAAAA" > android/app/src/main/assets/adi-registration.properties

      - name: Fix Android Build Tools
        run: |
          BUILD_TOOLS_PATH="$ANDROID_HOME/build-tools"
          LATEST_VERSION=$(ls $BUILD_TOOLS_PATH | sort -V | tail -n 1)
          echo "Linking $LATEST_VERSION to 29.0.3"
          sudo mkdir -p /usr/local/lib/android/sdk/build-tools
          sudo ln -s $BUILD_TOOLS_PATH/$LATEST_VERSION /usr/local/lib/android/sdk/build-tools/29.0.3

      - name: Build Unsigned Release (APK & AAB)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Sign Android APK
        uses: r0adkll/sign-android-release@v1
        id: sign_apk
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Sign Android AAB
        uses: r0adkll/sign-android-release@v1
        id: sign_aab
        with:
          releaseDirectory: android/app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Get Digital Fingerprints (SHA)
        run: |
          echo "--- Keystore Fingerprints ---"
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore
          keytool -list -v -keystore release.keystore -alias "${{ secrets.ANDROID_KEY_ALIAS }}" -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" | grep -E "SHA1|SHA256"
          rm release.keystore

      - name: Upload Signed Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quraaniat-release-files
          path: |
            ${{ steps.sign_apk.outputs.signedReleaseFile }}
            ${{ steps.sign_aab.outputs.signedReleaseFile }}
          retention-days: 30